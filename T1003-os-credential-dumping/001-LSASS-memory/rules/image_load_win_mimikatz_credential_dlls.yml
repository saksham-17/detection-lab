title: Mimikatz Loads Credential DLLs During Offline LSASS Extraction — Image Load
id: a8d4c9b7-0e3f-4a57-2b6d-7c1e4f9a0d3a
status: stable
description: >
    Detects mimikatz.exe loading samlib.dll or vaultcli.dll, which it imports for
    SAM and Credential Vault extraction during offline credential theft from a LSASS
    dump. 
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://www.atomicredteam.io/docs/atomics/T1003.001#atomic-test-6-offline-credential-theft-with-mimikatz
author: Saksham Bhattarai
date: 2026-09-26
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: image_load
    product: windows
detection:
    selection_image:
        Image|endswith: '\mimikatz.exe'
    selection_dll:
        ImageLoaded|endswith:
            - '\samlib.dll'
            - '\vaultcli.dll'
    condition: selection_image and selection_dll
falsepositives:
    - None — samlib.dll or vaultcli.dll loaded by mimikatz.exe specifically has no legitimate explanation
level: critical
