name: Sigma Rule Validation

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate Sigma Rules
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install sigma-cli
        run: python -m pip install sigma-cli

      - name: Validate all Sigma rules
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' dir; do
            while IFS= read -r -d '' rule; do
              echo "Checking: $rule"
              sigma check --fail-on-error "$rule"
              count=$((count + 1))
            done < <(
              find "$dir" -maxdepth 1 -type f \
                \( -name "*.yml" -o -name "*.yaml" \) \
                -print0
            )
          done < <(
            find . \
              -type d \( -name .git -o -name .github \) -prune -o \
              -type d -name rules -print0
          )

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No Sigma rules found in any rules/ directory."
            exit 1
          fi

          echo "Successfully checked $count Sigma rule(s)."